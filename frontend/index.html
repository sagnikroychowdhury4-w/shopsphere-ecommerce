
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopSphere — Synthetic E-Commerce</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="logo">ShopSphere</div>
  <div class="tag">Synthetic E-Commerce Demo</div>
  <nav><a href="/">Home</a><a href="/docs" target="_blank">Reviews API</a></nav>
</header>
<main>
  <section class="hero">
    <div><h1>Products powered by <span>realistic synthetic reviews</span></h1>
    <p>Browse products, ratings and customer feedback. The backend exposes every review through a public REST API.</p></div>
    <div class="stats" id="stats"></div>
  </section>
  <section class="toolbar">
    <input id="search" placeholder="Search products or reviews…">
    <select id="rating"><option value="">All ratings</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
    <select id="sentiment"><option value="">All sentiment</option><option value="positive">Positive</option><option value="neutral">Neutral</option><option value="negative">Negative</option></select>
    <button onclick="loadReviews(1)">Search</button>
  </section>
  <section><h2>Customer Reviews</h2><div id="reviews" class="reviews"></div><div class="pager"><button id="prev">Previous</button><span id="page"></span><button id="next">Next</button></div></section>
</main>
<footer>ShopSphere Demo · FastAPI + PostgreSQL · <a href="/reviews?limit=20" target="_blank">/reviews</a></footer>
<script src="/static/app.js"></script>
</body>
</html>
