services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://ecommerce:ecommerce@db:5432/ecommerce
    ports: ["8000:8000"]
    depends_on: [db]
    command: sh -c "python backend/seed.py && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
volumes:
  pgdata:
